<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trujados — Lobby</title>
  <link rel="stylesheet" href="/estilo.css">
</head>
<body>
  <div class="lobby">
    <header>
      <h1>🎮 Trujados</h1>
      <p class="sub">Creá tu agente y dejaló jugar solo.</p>
    </header>

    <div class="card">
      <label>Nombre del agente</label>
      <input id="nombre" maxlength="30" placeholder="Ej: Ana">

      <label>Avatar</label>
      <div class="avatares" id="avatares"></div>

      <label>Personalidad (máx. 140 caracteres)</label>
      <textarea id="personalidad" maxlength="140" placeholder="Ej: Competitiva, le gusta arriesgar"></textarea>

      <label>Especialidad</label>
      <select id="especialidad"></select>

      <label>Punto débil</label>
      <select id="puntoDebil"></select>

      <button id="crear">Crear mi agente</button>
      <p class="hint" id="estado"></p>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/cliente.js"></script>
  <script>
    const CATS = ["Ciencia", "Historia", "Geografía", "Arte", "Deportes", "Entretenimiento"];
    const PALETA = ["#e74c3c", "#3498db", "#2ecc71", "#f1c40f", "#9b59b6", "#e67e22", "#1abc9c", "#e84393"];
    const PALETA_OSCURA = ["#922b21", "#1f4e79", "#1e8449", "#9a7d0a", "#6c3483", "#935116", "#117864", "#922b55"];
    let avatarSel = 0;

    function dibujarPersonaje(g, c, variante) {
      const s = 16, u = 1;
      const skin = "#f6c89f";
      const dark = PALETA_OSCURA[variante % PALETA_OSCURA.length];
      function px(x,y,w,h,color){ g.fillStyle=color; g.fillRect(x,y,w,h); }
      px(6,13,2,3,dark); px(9,13,2,3,dark);
      px(4,8,9,5,c);
      px(4,8,2,5,"rgba(0,0,0,0.18)");
      px(3,9,1,4,skin); px(13,9,1,4,skin);
      px(4,3,8,5,skin);
      px(6,5,2,2,"#222"); px(9,5,2,2,"#222");
      px(7,7,3,1,"#b0563a");
      const v = variante % 8;
      if (v === 0) { px(4,1,8,2,c); px(3,3,1,2,c); }
      else if (v === 1) { px(5,4,2,2,"#222"); px(9,4,2,2,"#222"); px(7,5,2,1,"#222"); }
      else if (v === 2) { px(4,0,8,2,"#f1c40f"); px(4,2,2,1,"#f1c40f"); px(10,2,2,1,"#f1c40f"); }
      else if (v === 3) { px(7,0,1,3,"#888"); px(6,0,3,2,"#e74c3c"); }
      else if (v === 4) { px(5,0,2,3,c); px(7,0,2,2,c); px(9,0,2,3,c); }
      else if (v === 5) { px(4,0,8,3,"#111"); px(3,3,10,1,"#111"); }
      else if (v === 6) { px(3,0,10,1,"#111"); px(3,1,1,3,"#111"); px(12,1,1,3,"#111"); }
      else { px(4,1,8,1,"#fff"); px(3,1,1,2,"#fff"); px(12,1,1,2,"#fff"); }
    }

    function poblarSelects() {
      const es = document.getElementById("especialidad");
      const pd = document.getElementById("puntoDebil");
      CATS.forEach((c) => {
        es.add(new Option(c, c));
        pd.add(new Option(c, c));
      });
      pd.value = "Deportes";
    }

    function pintarAvatares() {
      const cont = document.getElementById("avatares");
      cont.innerHTML = "";
      PALETA.forEach((c, i) => {
        const cv = document.createElement("canvas");
        cv.width = 16; cv.height = 16;
        const g = cv.getContext("2d");
        dibujarPersonaje(g, c, i);
        cv.classList.add("pixel");
        if (i === avatarSel) cv.classList.add("sel");
        cv.onclick = () => { avatarSel = i; pintarAvatares(); };
        cont.appendChild(cv);
      });
    }

    document.getElementById("crear").onclick = async () => {
      const body = {
        nombre: document.getElementById("nombre").value.trim(),
        avatar: avatarSel,
        personalidad: document.getElementById("personalidad").value.trim(),
        especialidad: document.getElementById("especialidad").value,
        puntoDebil: document.getElementById("puntoDebil").value,
      };
      const st = document.getElementById("estado");
      if (!body.nombre) { st.textContent = "Poné un nombre."; return; }
      const res = await fetch("/api/agentes", {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
      });
      const d = await res.json();
      if (d.ok) {
        st.textContent = "✅ " + d.agente.nombre + " está listo. Llevándote al juego…";
        st.classList.add("ok");
        document.getElementById("crear").disabled = true;
        setTimeout(function(){ window.location.href = "/pantalla"; }, 800);
      } else {
        st.textContent = "❌ " + (d.error || "algo salió mal");
      }
    };

    poblarSelects();
    pintarAvatares();
  </script>
</body>
</html>
